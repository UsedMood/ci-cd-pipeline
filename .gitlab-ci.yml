variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

image: maven:3-openjdk-11

cache:
  key: "maven-cache"
  paths:
    - .m2/repository

stages:
  - build
  - test
  - docker
  - deploy

Build:
  stage: build
  tags:
    - local
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.war
    expire_in: 1 hour

Test:
  stage: test
  tags:
    - local
  dependencies:
    - Build
  before_script:
    - apt-get update -qq
    - apt-get install -y wget gnupg
    - wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add -
    - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list
    - apt-get update -qq
    - apt-get install -y google-chrome-stable
  script:
    - mvn test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 1 week

Docker Build & Push:
  stage: docker
  tags:
    - local
  dependencies:
    - Build
    - Test
  before_script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
  script:
    - docker build -t "$DOCKERHUB_USERNAME/md-searcher:latest" .
    - docker push "$DOCKERHUB_USERNAME/md-searcher:latest"

Deploy Staging:
  stage: deploy
  tags:
    - local
  when: manual
  environment:
    name: staging
  script:
    - echo "Deploying to staging..."